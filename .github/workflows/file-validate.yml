name: File Validation Workflow
on: workflow_dispatch

jobs:
    validate-files:
        runs-on: ubuntu-latest
        steps:
            - name: clone repository
              uses: actions/checkout@v4

            - name: validate html file
              run: |
                  echo "Validating HTML file..."
                  test -f index.html

            - name: validate js file
              run: |
                  echo "Validating JavaScript file..."
                  test -f index.js

            - name: validate js code
              run: |
                  echo "Validating JavaScript code..."
                  node --check index.js
